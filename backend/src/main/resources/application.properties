# =============================================================================
# Receivly Backend — Main configuration
# =============================================================================
# All runtime values are read from environment variables.
# Define them in backend/.env (copy from .env.example). Never commit .env.
# =============================================================================

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
spring.application.name=receivly-backend

# -----------------------------------------------------------------------------
# Server — PORT (Koyeb/Heroku), else SERVER_PORT, else 8080
# -----------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}

# -----------------------------------------------------------------------------
# Database — from .env: DATABASE_*
# -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/receivly}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (shared)
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT — set JWT_SECRET in .env or env; default below is for local dev only (never use in production)
app.jwt.secret=${JWT_SECRET:this-is-a-local-dev-secret-key-minimum-256-bits-long-do-not-use-in-prod}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# CORS — from .env: CORS_ORIGINS
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Resend email service
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:noreply@example.com}

# -----------------------------------------------------------------------------
# Actuator — only expose health, hide all others
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# -----------------------------------------------------------------------------
# Error handling — never expose stack traces
# -----------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
