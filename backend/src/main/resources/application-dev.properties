# =============================================================
# DEV PROFILE — local development, no env vars needed
# Run: mvn spring-boot:run
# =============================================================

# PostgreSQL (local Homebrew)
spring.datasource.url=jdbc:postgresql://localhost:5432/receivly
spring.datasource.username=lohithkumar
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# JWT (dev-only secret — NEVER use in production)
app.jwt.secret=this-is-a-local-dev-secret-key-minimum-256-bits-long-do-not-use-in-prod

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
